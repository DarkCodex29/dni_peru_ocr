name: dni_peru_ocr
description: Peruvian DNI OCR helpers — ML Kit text recognition denoise, MRZ parsing, address extraction, and surname normalization for the Peruvian Documento Nacional de Identidad.
version: 0.15.0
homepage: https://github.com/DarkCodex29/dni_peru_ocr
repository: https://github.com/DarkCodex29/dni_peru_ocr
issue_tracker: https://github.com/DarkCodex29/dni_peru_ocr/issues

topics:
  - ocr
  - flutter
  - identity
  - peru
  - mrz

platforms:
  android:
  ios:

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.3.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  flutter_image_compress: ^2.3.0
  google_mlkit_face_detection: ^0.13.2
  google_mlkit_text_recognition: ^0.15.0
  image: ^4.5.4
  logger: ^2.5.0
  mrz_parser: ^2.0.1
  path_provider: ^2.1.5
  dio: '>=5.0.0 <6.0.0'

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  fake_async: ^1.3.1
